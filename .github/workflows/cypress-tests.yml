name: Cypress Tests with Media

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  schedule:
    - cron: '0 4 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean old reports
        run: rm -rf cypress/reports cypress/screenshots cypress/videos

      - name: Run Cypress Tests
        id: run-tests
        run: npm run test-ci
        env:
          CI: true
        continue-on-error: true # ⭐ KEEP RUNNING EVEN IF TESTS FAIL!

      # ⭐ UPLOAD & DEPLOY RUNS REGARDLESS OF PASS/FAIL!
      - name: Upload Report to GitHub Pages
        if: always() # ⭐ ALWAYS RUN — PASS OR FAIL!
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/reports

      - name: Deploy Live Report
        id: deployment
        if: always() # ⭐ ALWAYS DEPLOY!
        uses: actions/deploy-pages@v4

      - name: Upload Screenshots
        if: always() # ⭐ ALWAYS UPLOAD SCREENSHOTS!
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: cypress/reports/screenshots
          retention-days: 14

      - name: Upload Videos
        if: always() # ⭐ ALWAYS UPLOAD VIDEOS!
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: cypress/reports/videos
          retention-days: 14

      # ⭐ MARK BUILD AS FAILED BUT REPORT STILL PUBLISHED!
      - name: Preserve overall job status
        if: always()
        run: |
          if [ "${{ steps.run-tests.outcome }}" = "failure" ]; then
            echo "⚠️ Tests failed — but report was published!"
            exit 1 # ⭐ Shows build as FAILED — HONEST!
          else
            echo "✅ All tests passed!"
            exit 0
          fi