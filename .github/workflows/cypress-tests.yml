name: Cypress Tests with Media

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  schedule:
    - cron: '0 4 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean old reports
        run: rm -rf cypress/reports cypress/screenshots cypress/videos

      - name: Run Cypress Tests
        id: run-tests
        run: npm run test-ci
        env:
          CI: true
        continue-on-error: true

      # 🔍 CRITICAL: LIST ALL FILES — SEE EXACTLY WHERE REPORT IS
      - name: List ALL generated files
        if: always()
        run: |
          echo "=== Cypress folder structure ==="
          find cypress -type f -name "*.html" || echo "NO HTML FILE FOUND"
          echo "=== Full listing ==="
          ls -laR cypress/

      # ✅ WE WILL UPDATE THIS PATH AFTER SEEING THE LIST!
      - name: Upload Report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/reports  # ⭐ TEMPORARY — WE'LL CHANGE AFTER SEEING OUTPUT

      - name: Deploy Live Report
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: cypress/reports/screenshots
          retention-days: 14

      - name: Upload Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: cypress/reports/videos
          retention-days: 14

      - name: Preserve overall job status
        if: always()
        run: |
          if [ "${{ steps.run-tests.outcome }}" = "failure" ]; then
            exit 1
          else
            exit 0
          fi